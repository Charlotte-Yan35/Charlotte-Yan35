<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="The story so far. 2024: mathematical modelling, CFD, a first ML course. 2025: scientific computation, statistics in R. 2026: power-grid dynamics, small-world networks. Now: computer vision at Penn, reading text through moire.">
